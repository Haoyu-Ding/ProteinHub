[project]
name = "proteinhub"
version = "0.1.0"
description = "ProteinHub MVP: project-scoped protein sequence and artifact management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnachisel>=3.2.16",
    "fastapi>=0.115.0",
    "nicegui>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "segno>=1.6.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["proteinhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
